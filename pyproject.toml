[project]
name = "socialapihq"
version = "0.1.3"
description = "The official Python SDK for SocialAPI: public social media data from TikTok, Instagram, Threads and Facebook in one schema"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SocialAPI", email = "support@socialapi.sh" }]
keywords = ["socialapi", "social-media", "scraping", "api", "sdk", "tiktok", "instagram", "threads", "facebook"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "urllib3>=2.1.0,<3.0.0",
  "python-dateutil>=2.8.2",
  "pydantic>=2.11",
  "typing-extensions>=4.7.1",
]

[project.urls]
Homepage = "https://socialapi.sh"
Documentation = "https://socialapi.sh/docs"
Repository = "https://github.com/socialapihq/socialapi-python"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socialapihq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
