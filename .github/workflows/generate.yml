name: Regenerate

# The API's deploy workflow dispatches `openapi-updated` after each production deploy.
# The run regenerates the package from the live spec and, when it changed, tests, bumps,
# commits, publishes to PyPI and releases. No change: it stops after the diff.
on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      release:
        description: Release even if the spec did not change (the first release)
        type: boolean
        default: false

concurrency:
  group: regenerate-sdk
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate, release and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # PyPI trusted publishing
    environment: pypi

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # OpenAPI Generator runs through its npm wrapper, at the version in openapitools.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      # The generator's jar, kept between runs (openapitools.json's storageDir) for its
      # version: Maven Central refuses GitHub's shared runner addresses now and then
      # ("Your ip has exceeded rate limits", a 429, which failed a run on 2026-11-27), so
      # it is downloaded only when the version changes.
      - name: Cache OpenAPI Generator
        uses: actions/cache@v4
        with:
          path: ~/.openapi-generator
          key: openapi-generator-${{ hashFiles('openapitools.json') }}

      # The npm wrapper downloads the jar on first use; fetch it up front when the cache
      # had none, waiting longer each time (about five minutes in all) for a rate limit
      # to pass, so a refused download does not fail the generation step.
      - name: Fetch OpenAPI Generator
        run: |
          for wait in 15 30 60 120 0; do
            npx --yes @openapitools/openapi-generator-cli version && exit 0
            [ "$wait" -gt 0 ] && sleep "$wait"
          done
          exit 1

      - name: Compute the next version
        id: version
        run: |
          CURRENT=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
          NEXT=$(python -c "v='$CURRENT'.split('.'); v[-1]=str(int(v[-1])+1); print('.'.join(v))")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # The gate's copy carries the current version, so the diff is only the spec's.
      - name: Regenerate from the live spec
        run: python scripts/generate.py --version ${{ steps.version.outputs.current }}

      - name: Check for changes
        id: changes
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            echo "Release asked for."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git status --porcelain -- src/ tests/ README.md)" ]; then
            echo "The SDK already matches the live spec."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git status --short
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate with the release version
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python scripts/generate.py --version ${{ steps.version.outputs.next }}
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.next }}\"/" pyproject.toml

      - name: Test
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - name: Commit
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ tests/ README.md pyproject.toml
          git commit -m "Regenerate from the OpenAPI spec (v${{ steps.version.outputs.next }})"

      # Two dispatches close together race for main; the fresher regeneration wins.
      - name: Push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      - name: Check whether this version is published
        if: steps.changes.outputs.has_changes == 'true'
        id: published
        run: |
          if curl -sf "https://pypi.org/pypi/socialapihq/${{ steps.version.outputs.next }}/json" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.changes.outputs.has_changes == 'true' && steps.published.outputs.skip != 'true'
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: steps.changes.outputs.has_changes == 'true' && steps.published.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub release
        if: steps.changes.outputs.has_changes == 'true' && steps.published.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.next }}
          name: v${{ steps.version.outputs.next }}
          generate_release_notes: true
          body: |
            Regenerated from the API's OpenAPI spec.

            ```sh
            pip install socialapihq==${{ steps.version.outputs.next }}
            ```
